name: aurora
description: "A B2B marketplace for sellers and factories."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.4
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.5
  provider: ^6.1.5
  flutter_dotenv: ^6.0.1
  vault_storage: ^4.0.0
  image_picker: ^1.2.2
  debug_print: ^0.0.1+1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  cached_network_image: ^3.4.1
  package_info_plus: ^9.0.0
  local_auth: ^2.3.0

flutter:
  uses-material-design: true
  generate: true
